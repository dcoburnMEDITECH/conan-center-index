  "20251117.7533":
    pdfium:
      url: "https://github.com/chromium/pdfium/archive/21a5abba11669e5c1ebb28babccaee6108045583.tar.gz"
      sha256: "11c613e9418c93e91f61a81098d3597cd499d51f7eaff078bd374c7c9b00c7f5"
    build:
      url: "https://chromium.googlesource.com/chromium/src/build/+archive/8c2e4caf42ac5e2d3dbe5f568079f7df2ce8a3e4.tar.gz"
      # sha256 is volatile on googlesource tarballs
    abseil_cpp:
      url: "https://chromium.googlesource.com/chromium/src/third_party/abseil-cpp/+archive/14a5b78f39684f85a19690e63c722d6bb680f2cd.tar.gz"
      # sha256 is volatile on googlesource tarballs
    fast_float:
      url: "https://chromium.googlesource.com/external/github.com/fastfloat/fast_float/+archive/cb1d42aaa1e14b09e1452cfdef373d051b8c02a4.tar.gz"
