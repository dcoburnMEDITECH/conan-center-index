patches:
  "20251117.7533":
    - patch_file: "patches/20251117.7533-0001-msvc-safe-math-disable-builtins.patch"
      patch_description: "Disable clang/gcc safe math builtins on MSVC (uses fallback stubs)"
      patch_type: "portability"
    - patch_file: "patches/20251117.7533-0002-msvc-immediate-crash-debugbreak.patch"
      patch_description: "Use __debugbreak() instead of asm volatile on MSVC x86"
      patch_type: "portability"
    - patch_file: "patches/20251117.7533-0003-msvc-byteorder-constexpr-swap.patch"
      patch_description: "Replace __builtin_bswap with constexpr byte swap on MSVC"
      patch_type: "portability"
    - patch_file: "patches/20251117.7533-0004-msvc-debug-iterator-allocator.patch"
      patch_description: "Allow MSVC debug _Container_proxy through partition allocator assert"
      patch_type: "portability"
    - patch_file: "patches/20251117.7533-0005-strip-pdfium-all-test-deps.patch"
      patch_description: "Remove pdfium_all test target group that requires gclient-only deps"
      patch_type: "conan"
